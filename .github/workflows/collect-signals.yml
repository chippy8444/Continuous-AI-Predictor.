name: RA Signal Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  collect-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RA signal collector
        run: python signal_agent.py

      - name: Commit collected signal data
        run: |
          git config user.name "ra-signal-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No signal changes to commit."
          else
            git commit -m "chore: collect RA signals ${{ github.run_id }} [skip ci]"
            git push
          fi

      - name: Upload latest signal report
        uses: actions/upload-artifact@v4
        with:
          name: ra-signal-report
          path: |
            reports/latest.md
            data/latest.json
            data/metrics.csv
          if-no-files-found: warn
